[package]
name = "seda"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
description = "Static in-memory HTTP backend companion to SeDat"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/WPreier/seda"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2.0"
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["user"] }
signal-hook = "0.3"

[build-dependencies]
pulldown-cmark = "0.10"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.15"

[[bin]]
name = "seda"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
